# ─────────────────────────────────────────────────────────────────────────────
# Pattern 1 — Plan / Review / Apply
# Runs on every PR that touches infrastructure or app content.
# Posts the plan output as a PR comment so reviewers can see exactly what
# will change before approving.
#
# Pattern 2 (gates applied per target):
#   1. terraform fmt       — style violations
#   2. terraform validate  — bad references
#   3. trivy (IaC)         — security misconfigurations (HIGH/CRITICAL)
#   4. terraform plan      — full change preview posted to the PR
#
# Targets:
#   shared → bootstrap resources (OIDC provider, IAM role, S3 state) —
#            uses the sibling account role
#   dev    → per-environment website infra — uses the env's scoped role
#
# Each leg uses its own GitHub Actions environment, so secrets.AWS_ROLE_ARN,
# vars.AWS_REGION, and vars.TF_STATE_BUCKET resolve to that target's values.
# ─────────────────────────────────────────────────────────────────────────────

name: Terraform Plan

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - "app/**"
      - "policies/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to plan"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - shared
          - dev

permissions:
  id-token: write # lets GitHub issue an OIDC token
  contents: read
  pull-requests: write

jobs:
  setup:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: build
        run: |
          SHARED='{"target":"shared","backend_key":"${{ github.event.repository.name }}/terraform.tfstate","working_dir":"infrastructure/shared"}'
          DEV='{"target":"dev","backend_key":"dev/website/terraform.tfstate","var_file":"environments/dev/terraform.tfvars","working_dir":"infrastructure"}'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ inputs.environment }}"
            case "$ENV" in
              shared)     echo "matrix={\"include\":[$SHARED]}"                              >> "$GITHUB_OUTPUT" ;;
              dev)        echo "matrix={\"include\":[$DEV]}"                                 >> "$GITHUB_OUTPUT" ;;
              *)          echo "matrix={\"include\":[$SHARED,$DEV]}"                         >> "$GITHUB_OUTPUT" ;;
            esac
          else
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
            SHARED_CHANGED=false
            OTHER_CHANGED=false
            ALL_CHANGED=false
            while IFS= read -r f; do
              [[ "$f" == infrastructure/shared/* ]]     && SHARED_CHANGED=true
              [[ "$f" == infrastructure/* && "$f" != infrastructure/shared/* ]] && OTHER_CHANGED=true
              [[ "$f" == app/* ]]                        && OTHER_CHANGED=true
              # Policy or workflow changes affect every target — run all
              [[ "$f" == policies/* || "$f" == .github/workflows/terraform-plan.yml ]] && ALL_CHANGED=true
            done <<< "$CHANGED"

            if [[ "$ALL_CHANGED" == true ]]; then
              echo "matrix={\"include\":[$SHARED,$DEV]}" >> "$GITHUB_OUTPUT"
            else
              PARTS=()
              [[ "$SHARED_CHANGED" == true ]]     && PARTS+=("$SHARED")
              [[ "$OTHER_CHANGED" == true ]]       && PARTS+=("$DEV")

              JOINED=$(printf '%s,' "${PARTS[@]}" | sed 's/,$//')
              echo "matrix={\"include\":[$JOINED]}" >> "$GITHUB_OUTPUT"
            fi
          fi

  plan:
    name: Plan — ${{ matrix.target }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.target }}
    needs: setup
    env:
      TF_VAR_repository_name: ${{ github.event.repository.name }}
      TF_VAR_repository_organization: ${{ github.repository_owner }}
      TF_VAR_scp_target_id: ${{ vars.OU_TARGET_ID }}
      TF_VAR_rcp_target_id: ${{ vars.OU_TARGET_ID }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.working_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ── Pattern 1: OIDC Authentication ──────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false

      # ── Gate 1: Format ───────────────────────────────────────────────────────
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # ── Init — backend key scoped to the target ──────────────────────────────
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.backend_key }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -input=false

      # ── Gate 2: Validate ─────────────────────────────────────────────────────
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # ── Gate 3: Security Scan ────────────────────────────────────────────────
      - name: Run Trivy (IaC security scan)
        id: tfsec
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: ${{ matrix.working_dir }}
          severity: CRITICAL
          exit-code: "1"
          format: table
          output: ${{ runner.temp }}/trivy-results.txt

      - name: Capture Trivy output
        id: trivy_output
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/trivy-results.txt" ]; then
            {
              echo "output<<TRIVYEOF"
              cat "${{ runner.temp }}/trivy-results.txt"
              echo "TRIVYEOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # ── Gate 4: Plan ─────────────────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            ${{ matrix.var_file && format('-var-file="{0}"', matrix.var_file) || '' }} \
            -out=$GITHUB_WORKSPACE/tfplan-${{ matrix.target }}.binary \
            -no-color \
            -input=false
        continue-on-error: true

      # ── Gate 5: OPA Policy ────────────────────────────────────────────────
      - name: Setup OPA
        if: steps.plan.outcome == 'success'
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Generate plan JSON
        if: steps.plan.outcome == 'success'
        run: |
          terraform show -json $GITHUB_WORKSPACE/tfplan-${{ matrix.target }}.binary \
            > $GITHUB_WORKSPACE/tfplan-${{ matrix.target }}.json

      - name: OPA policy check
        id: opa
        if: steps.plan.outcome == 'success'
        run: |
          set +e
          opa eval \
            --format pretty \
            --data $GITHUB_WORKSPACE/policies/terraform.rego \
            --input $GITHUB_WORKSPACE/tfplan-${{ matrix.target }}.json \
            "data.terraform.deny[_]" \
            --fail-defined > $GITHUB_WORKSPACE/opa-output.txt 2>&1
          OPA_EXIT=$?
          {
            echo "output<<OPAEOF"
            cat $GITHUB_WORKSPACE/opa-output.txt
            echo "OPAEOF"
          } >> "$GITHUB_OUTPUT"
          exit $OPA_EXIT
        continue-on-error: true

      # ── Post plan to PR ──────────────────────────────────────────────────────
      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          OPA_OUTPUT: ${{ steps.opa.outputs.output }}
          TRIVY_OUTPUT: ${{ steps.trivy_output.outputs.output }}
        with:
          script: |
            const fmt        = '${{ steps.fmt.outcome }}';
            const init       = '${{ steps.init.outcome }}';
            const validate   = '${{ steps.validate.outcome }}';
            const tfsec      = '${{ steps.tfsec.outcome }}';
            const plan       = '${{ steps.plan.outcome }}';
            const opa        = '${{ steps.opa.outcome }}';
            const target     = '${{ matrix.target }}';
            const planOutput = process.env.PLAN_OUTPUT;
            const opaOutput  = process.env.OPA_OUTPUT;
            const trivyOutput = process.env.TRIVY_OUTPUT;

            const icon = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';

            const warning = target === 'shared'
              ? '\n> ⚠️ Bootstrap resources shared across all environments (OIDC provider, IAM role). Review carefully.\n'
              : '';

            const trivyDetails = tfsec === 'failure' && trivyOutput
              ? `\n<details><summary>Trivy findings</summary>\n\n\`\`\`\n${trivyOutput}\n\`\`\`\n\n</details>\n`
              : '';

            const opaDetails = opa === 'failure' && opaOutput
              ? `\n<details><summary>OPA violations</summary>\n\n\`\`\`\n${opaOutput}\n\`\`\`\n\n</details>\n`
              : '';

            const body = `### Terraform Plan — \`${target}\`
            ${warning}
            | Gate | Status |
            |---|---|
            | Format | ${icon(fmt)} \`${fmt}\` |
            | Init | ${icon(init)} \`${init}\` |
            | Validate | ${icon(validate)} \`${validate}\` |
            | Security (Trivy) | ${icon(tfsec)} \`${tfsec}\` |
            | Plan | ${icon(plan)} \`${plan}\` |
            | OPA Policies | ${icon(opa)} \`${opa}\` |
            ${trivyDetails}${opaDetails}
            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`

            </details>

            *Triggered by @${{ github.actor }} on \`${{ github.ref_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if fmt failed
        if: steps.fmt.outcome == 'failure'
        run: exit 1

      - name: Fail if tfsec failed
        if: steps.tfsec.outcome == 'failure'
        run: exit 1

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Fail if OPA failed
        if: steps.opa.outcome == 'failure'
        run: exit 1
